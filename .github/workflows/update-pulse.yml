name: Refresh research pulse

on:
  workflow_dispatch:
  repository_dispatch:
    types: [research-pulse]
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: research-pulse
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate pulse
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_pulse.py

      - name: Commit only when signal changed
        shell: bash
        run: |
          if git diff --quiet -- assets/research-pulse.svg; then
            echo "No meaningful pulse change."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/research-pulse.svg
          git commit -m "chore: refresh research pulse"
          git push
